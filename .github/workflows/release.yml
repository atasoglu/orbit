name: Release

# Push a tag like v0.1.0 to build the Linux packages and publish them.
# Release notes come from the matching section of CHANGELOG.md, followed by a
# "Full Changelog" link comparing this tag with the previous one.
# Tests are not repeated here: tag the commit that already passed CI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to find the previous version

      - name: Check tag matches Cargo version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$VERSION" = "$CARGO" ] || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO"; exit 1; }

      - name: Write release notes
        run: |
          PREV="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          ./packaging/release-notes.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$PREV" | tee notes.md

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libx11-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build .deb and tarball
        run: ./packaging/build-deb.sh

      - name: Check package ownership
        run: |
          # The root-run helper must be root-owned inside the package.
          dpkg-deb -c dist/*.deb | grep 'usr/lib/orbit/orbit-scan-helper' | grep -q 'root/root'

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-linux
          path: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Orbit $GITHUB_REF_NAME" --notes-file notes.md
